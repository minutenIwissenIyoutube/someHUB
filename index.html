<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>someHub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<style>
  /* Layout: eine schmale Dashboard-Karte, vier Kennzahlen oben, Verwaltung darunter. Dunkles Marineblau wie im Entwurf. */
  :root {
    --bg: #000;
    --panel: #182a45;
    --tile: #2a3f5f;
    --chip: #2a3f5f;
    --chip-active: #3b5a88;
    --text: #fff;
    --muted: #9fb3d1;
    --green: #22c55e;
    --green-bg: #12402f;
    --line: #3d5272;
    --red: #f87171;
    --red-bg: #4a1d24;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { width: 100%; max-width: 520px; min-width: 0; background: var(--panel); border-radius: 22px; padding: 24px 20px; align-self: flex-start; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: .5px; }
  .badge { background: var(--green-bg); color: var(--green); font-weight: 600; padding: 8px 16px; border-radius: 999px; font-size: 18px; cursor: pointer; border: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { background: var(--tile); border-radius: 16px; padding: 16px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between;
          border: 0; font: inherit; color: inherit; text-align: left; width: 100%; min-width: 0; cursor: pointer; transition: background .15s; }
  .tile:hover, .tile.active { background: var(--chip-active); }
  .tile:focus-visible, .chip:focus-visible, .badge:focus-visible, .btn:focus-visible, .row.link:focus-visible, button.pill:focus-visible,
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .tile .label { color: var(--muted); font-size: 18px; overflow-wrap: anywhere; hyphens: auto; }
  .tile .value { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
  h2 { font-size: 24px; margin: 0 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { background: var(--chip); color: var(--text); border: 0; border-radius: 999px; padding: 10px 16px; font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
  .chip.active { background: var(--chip-active); }
  .chips.sub { margin: 4px 0 12px; gap: 8px; }
  .chips.sub .chip { font-size: 15px; padding: 8px 14px; }
  .ico { width: 26px; height: 26px; display: block; flex: none; }
  .panel { margin-top: 22px; }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .head strong { font-size: 20px; }
  .sub { font-size: 16px; color: var(--muted); margin: 18px 0 10px; font-weight: 600; }
  .row { background: var(--tile); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row > span, .row > div { min-width: 0; }
  .row strong { overflow-wrap: anywhere; }
  .row small { color: var(--muted); display: block; margin-top: 2px; overflow-wrap: anywhere; }
  .row.link { width: 100%; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .row.link:hover { background: var(--chip-active); }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--chip-active); white-space: nowrap; }
  .q { color: var(--muted); opacity: .6; font-weight: 400; }
  .btn.connect { width: 100%; padding: 14px 16px; font-size: 17px; }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover { background: var(--chip-active); }
  a.vlink { display: inline-block; margin: 4px 0; padding: 4px 8px 4px 0; font-size: 14px; color: var(--green); text-decoration: none; }
  a.vlink:hover { text-decoration: underline; }
  [hidden] { display: none !important; }
  button.tl { display: block; background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  button.tl:hover strong { text-decoration: underline; }
  button.pill { border: 0; color: inherit; font-family: inherit; cursor: pointer; }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar-wrap { margin-bottom: 14px; }
  .bar-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 16px; }
  .bar { height: 12px; background: var(--tile); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--green); border-radius: 999px; }
  .bar.alt > span { background: var(--chip-active); }
  .note { color: var(--muted); font-size: 14px; margin: 16px 0 0; line-height: 1.4; }
  .flash { color: var(--green); font-size: 14px; min-height: 1.2em; margin: 6px 0 0; }
  .toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .btn { background: var(--green-bg); color: var(--green); border: 0; border-radius: 999px; padding: 8px 14px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn.off, .btn.ghost { background: var(--chip); color: var(--text); }
  .btn.off { color: var(--muted); }
  .btn.solid { background: var(--green); color: #04210f; font-weight: 600; }
  .btn.danger { background: var(--red-bg); color: var(--red); }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg .btn { font-size: 16px; }
  .muted { color: var(--muted); }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0; }
  .rate { color: var(--muted); font-size: 14px; margin: 4px 2px 14px; line-height: 1.4; }

  .empty { background: var(--tile); border-radius: 14px; padding: 18px; display: grid; gap: 10px; justify-items: start; }
  .empty strong { font-size: 18px; }
  .empty p { margin: 0; color: var(--muted); line-height: 1.45; }
  .steps { margin: 0; padding-left: 20px; color: var(--muted); line-height: 1.6; }

  .kv { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .kv .k { color: var(--muted); font-size: 14px; padding-top: 2px; }
  .kv .v { overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .stat { background: var(--tile); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .stat span { display: block; color: var(--muted); font-size: 13px; }
  .stat strong { font-size: 18px; overflow-wrap: anywhere; }

  .form { background: var(--tile); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: grid; gap: 6px; min-width: 0; align-content: start; }
  .field label { color: var(--muted); font-size: 14px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 16px; cursor: pointer; width: fit-content; }
  .check input { width: 22px; height: 22px; padding: 0; margin: 0; flex: none; accent-color: var(--green); cursor: pointer; }
  input, select, textarea { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; }
  textarea { min-height: 76px; resize: vertical; }
  textarea.autosize { overflow: hidden; resize: none; min-height: 0; line-height: 1.4; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .err { color: var(--red); font-size: 14px; min-height: 1.2em; margin: 0; }
  .ig { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding-right: 6px; min-width: 0; min-height: 44px; }
  .ig:focus-within { outline: 2px solid var(--green); outline-offset: 2px; }
  .ig input { border: 0; background: transparent; padding: 10px 4px; flex: 1; min-width: 0; border-radius: 10px; }
  .ig input:focus-visible { outline: none; }
  .ig .btn { flex: none; }
  .ig.at { gap: 0; }
  .ig.at > .pre { padding-left: 12px; padding-right: 1px; }
  .ig.at input { padding-left: 1px; }
  .fcopy { display: flex; justify-content: flex-end; }
  .linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; padding: 2px 2px; cursor: pointer; text-decoration: none; border-radius: 4px; }
  .linkbtn:hover { color: var(--text); }
  .linkbtn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .ig textarea { border: 0; background: transparent; padding: 10px 4px 10px 12px; flex: 1; min-width: 0; border-radius: 10px; }
  .ig textarea:focus-visible { outline: none; }
  .tools { display: grid; gap: 8px; }
  .tools > .pre { padding-left: 2px; }
  .tools-list { display: grid; gap: 8px; }
  .tl { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; }
  .tl a, .tl > span { color: var(--green); overflow-wrap: anywhere; min-width: 0; }
  .tl > span { color: var(--text); }
  .tl .btn { flex: none; }
  .pre { color: var(--muted); opacity: .75; font-size: 16px; user-select: none; }
  .ig > .pre { padding-left: 12px; }
  .cc { display: flex; align-items: center; gap: 6px; background: transparent; border: 0; border-right: 1px solid var(--line); color: inherit; font: inherit; padding: 10px 8px 10px 12px; cursor: pointer; border-radius: 10px 0 0 10px; flex: none; }
  .cc:hover { background: var(--chip); }
  .cc:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
  .cc .caret { color: var(--muted); font-size: 12px; }
  .flag { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-size: 20px; line-height: 1; }
  .cc-list { margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: 240px; overflow-y: auto; }
  .cc-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; border: 0; background: transparent; color: inherit; font: inherit; padding: 10px 12px; text-align: left; cursor: pointer; }
  .cc-item:hover, .cc-item.sel { background: var(--chip); }
  .cc-item:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
  @media (max-width: 440px) {
    .fgrid { grid-template-columns: 1fr; }
    .fgrid.keep2 { grid-template-columns: 1fr 1fr; }
    .kv { grid-template-columns: 1fr auto; }
    .kv .k { grid-column: 1 / -1; }
    .tile .value { font-size: 30px; }
    .tile .label { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>

  // ---------- Speichern aus Formularen ----------
  // ---------- YouTube-Abruf (nur auf der eigenen Adresse, nicht in der Claude-Vorschau) ----------
  var YT_CLIENT_ID = "317016728001-4kq4p314agh53sgparg5df2b5e8pr7bl.apps.googleusercontent.com";
  var gisReady = null;
  function loadGis() {
    if (gisReady) return gisReady;
    gisReady = new Promise(function (res, rej) {
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      var sc = document.createElement("script");
      sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
      sc.onload = function () { res(); };
      sc.onerror = function () { gisReady = null; rej(new Error("gis")); };
      document.head.appendChild(sc);
    });
    return gisReady;
  }
  function ytToken() {
    return loadGis().then(function () {
      return new Promise(function (res, rej) {
        var tc = google.accounts.oauth2.initTokenClient({
          client_id: YT_CLIENT_ID,
          scope: "https://www.googleapis.com/auth/youtube.readonly",
          prompt: "select_account",
          callback: function (r) { if (r && r.access_token) res(r.access_token); else rej(new Error((r && r.error) || "denied")); },
          error_callback: function (e) { rej(new Error((e && e.type) || "popup")); }
        });
        tc.requestAccessToken();
      });
    });
  }
  function ytGet(token, path) {
    return fetch("https://www.googleapis.com/youtube/v3/" + path, { headers: { Authorization: "Bearer " + token } }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) { var e = new Error((j.error && j.error.message) || String(r.status)); e.status = r.status; throw e; } return j; });
    });
  }
  function ytVideoId(u) {
    var m = String(u || "").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
    return m ? m[1] : "";
  }
  function ytErrText(e) {
    var m = (e && e.message) || "";
    if (/gis/.test(m)) return "Google-Anmeldung konnte nicht geladen werden. Das geht nur auf deiner eigenen Adresse und mit Internetverbindung.";
    if (/popup/.test(m)) return "Das Anmeldefenster wurde blockiert oder geschlossen. Erlaube Pop-ups für diese Seite und versuche es noch einmal.";
    if (/access_denied|denied/.test(m)) return "Zugriff nicht erlaubt. Du musst bei Google „Erlauben“ wählen und als Testnutzer eingetragen sein.";
    if (/origin|redirect_uri/i.test(m)) return "Google lehnt diese Adresse ab. Trage sie bei Google unter Clients → Autorisierte JavaScript-Quellen ein.";
    return "Abruf nicht gelungen: " + (m || "unbekannter Fehler");
  }
  function ytRun(id) {
    var msgEl = $("#conn-msg");
    var say = function (t) { if (msgEl) msgEl.textContent = t; else flash(t); };
    say("Verbinde mit Google …");
    ytToken().then(function (token) {
      return ytGet(token, "channels?part=snippet,statistics&mine=true").then(function (j) {
        var ch = j.items && j.items[0];
        if (!ch) throw new Error("Zu diesem Google-Konto gehört kein YouTube-Kanal.");
        var st = ch.statistics || {};
        var subs = st.hiddenSubscriberCount ? null : parseInt(st.subscriberCount, 10);
        var views = parseInt(st.viewCount, 10) || 0;
        if (id === "form") {
          if (subs != null && $("#f-followers")) $("#f-followers").value = String(subs);
          if ($("#f-views")) $("#f-views").value = String(views);
          if (S.form) S.form.ytChannel = ch.id;
          say("Verbunden mit „" + ch.snippet.title + "“: " + (subs != null ? subs + " Abonnenten, " : "") + views + " Aufrufe. Speichere den Account, damit die Zahlen bleiben.");
          return;
        }
        var acc = S.docs[id]; if (!acc) return;
        var upd = Object.assign({}, acc, { ytChannel: ch.id, views: views, synced: new Date().toISOString() });
        if (subs != null) upd.followers = subs;
        var posts = list("post").filter(function (p) { return p.account === id && ytVideoId(p.url); });
        var ids = posts.map(function (p) { return ytVideoId(p.url); }).filter(function (v, i, a) { return a.indexOf(v) === i; }).slice(0, 50);
        var vp = ids.length ? ytGet(token, "videos?part=statistics&id=" + ids.join(",")) : Promise.resolve({ items: [] });
        return vp.then(function (vj) {
          var by = {}; (vj.items || []).forEach(function (v) { by[v.id] = parseInt((v.statistics || {}).viewCount, 10) || 0; });
          var n = 0;
          posts.forEach(function (p) { var vid = ytVideoId(p.url); if (by[vid] != null) { saveDoc(p.id, Object.assign({}, p, { views: by[vid] })); n++; } });
          saveDoc(id, upd);
          flash("Aktualisiert: " + (subs != null ? subs + " Abonnenten, " : "") + views + " Aufrufe" + (n ? ", " + n + " Videos." : "."));
        });
      });
    }).catch(function (e) { say(ytErrText(e)); });
  }

    var old = S.docs[id] || {};
    S.form = null;
    saveDoc(id, Object.assign({}, old, { kind: "income", date: val("i-date") || todayISO(), source: val("i-source"), account: val("i-account"), amount: amount, currency: val("i-cur") }));
  }

  // ---------- Klicks ----------
  document.addEventListener("click", function (e) {
    if (!e.target.closest("#cc-list, #cc-btn")) closeCc();
    var v = e.target.closest("[data-view]");
    if (v) { show(v.dataset.view); $("#panel").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.dataset.act, id = el.dataset.id;

    if (act.indexOf("del-") === 0) {
      var key = act + ":" + id;
      if (S.armed !== key) { S.armed = key; render(true); return; }
      S.armed = null;
    } else if (S.armed) { S.armed = null; render(true); }

    switch (act) {
      case "new-account": openForm("accounts", { type: "account" }); break;
      case "open-account": S.selected = id; S.form = null; render(true); break;
      case "edit-account": openForm("accounts", { type: "account", id: id }); break;
      case "del-account": S.selected = null; removeDoc(id); break;
      case "connect-account": {
        var pf = ($("#f-platform") || {}).value || "";
        if (pf === "YouTube") { ytRun("form"); break; }
        var cm = $("#conn-msg");
        if (cm) cm.textContent = "Für " + (pf || "diese Plattform") + " ist der automatische Abruf noch nicht eingebaut. Bis dahin trägst du die Zahlen von Hand ein.";
        break;
      }
      case "yt-refresh": ytRun(id); break;
      case "save-account": saveAccount(); break;
      case "back": S.selected = null; render(true); break;
      case "cancel-form": S.form = null; render(true); break;

      case "new-post": openForm("calendar", { type: "post" }); break;
      case "new-post-home": openForm("calendar", { type: "post" }); break;
      case "edit-post": openForm("calendar", { type: "post", id: id }); break;
      case "del-post": S.form = null; removeDoc(id); break;
      case "cancel-del": case "noop": break;
      case "save-post": savePost(); break;
      case "cycle-post": {
        var p = S.docs[id];
        if (p && p.status !== "Gepostet") saveDoc(id, Object.assign({}, p, { status: STATUSES[(STATUSES.indexOf(p.status) + 1) % STATUSES.length] }));
        break;
      }

      case "new-income": openForm("income", { type: "income" }); break;
      case "edit-income": openForm("income", { type: "income", id: id }); break;
      case "del-income": removeDoc(id); break;
      case "save-income": saveIncome(); break;

      case "cal-filter": saveDoc("settings", Object.assign({}, S.docs.settings || {}, { kind: "settings", calFilter: id })); break;
      case "stats-mode": saveDoc("settings", Object.assign({}, S.docs.settings || {}, { kind: "settings", statsMode: id })); break;
      case "set-cur": saveDoc("settings", Object.assign({}, S.docs.settings || {}, { kind: "settings", currency: id })); break;
      case "save-rate": {
        var r = toNum(val("s-rate"));
        if (!r) { flash("Bitte gib einen Kurs größer als null ein."); break; }
        saveDoc("settings", Object.assign({}, S.docs.settings || {}, { kind: "settings", rate: r }));
        flash("Kurs gespeichert.");
        break;
      }
      case "copy": copyText(el.dataset.val || "", el, null); break;
      case "toggle-pass": {
        var pi = document.getElementById(el.dataset.target);
        if (pi) { var reveal = pi.type === "password"; pi.type = reveal ? "text" : "password"; el.textContent = reveal ? "Verbergen" : "Anzeigen"; }
        break;
      }
      case "toggle-pw": {
        var pv = $("#pw-val"), acc = S.docs[S.selected];
        if (pv && acc) { var on = pv.dataset.shown === "1"; pv.textContent = on ? "••••••••" : (acc.password || ""); pv.dataset.shown = on ? "0" : "1"; el.textContent = on ? "Anzeigen" : "Verbergen"; }
        break;
      }
      case "copy-pw": { var acc2 = S.docs[S.selected]; if (acc2 && acc2.password) copyText(acc2.password, el, null); break; }
      case "copy-field": {
        var inp = document.getElementById(el.dataset.target);
        var t = inp ? bare(inp.value) : "";
        if (!t) { flash("Trage zuerst etwas ein."); break; }
        copyText(t, el, inp);
        break;
      }
      case "add-tool": {
        var tl = $("#tools-list");
        if (tl) { tl.insertAdjacentHTML("beforeend", toolRow("")); var lastTa = tl.lastElementChild.querySelector("textarea"); autosize(lastTa); lastTa.focus(); }
        break;
      }
      case "remove-tool": {
        var trow = el.closest(".tool-row"), tlist = $("#tools-list");
        if (trow && tlist) { trow.remove(); if (!tlist.children.length) tlist.insertAdjacentHTML("beforeend", toolRow("")); }
        break;
      }
      case "copy-tool": {
        var tta = el.closest(".tool-row").querySelector("textarea"), tval = tta.value.trim();
        if (!tval) { flash("Trage zuerst einen Link ein."); break; }
        copyText(tval, el, tta);
        break;
      }
      case "cc-toggle": {
        var l = $("#cc-list");
        if (l) { l.hidden = !l.hidden; el.setAttribute("aria-expanded", l.hidden ? "false" : "true"); }
        break;
      }
      case "cc-pick": {
        setCountry(id, true); closeCc();
        var ph = $("#f-phone"); if (ph) ph.focus();
        break;
      }
      case "import": { var fi = $("#imp-file"); if (fi) { fi.value = ""; fi.click(); } break; }
      case "export": {
        var fname = "somehub-sicherung-" + todayISO() + ".json", fdata = JSON.stringify(S.docs, null, 2);
        if (!store.downloads) {
          try {
            var url = URL.createObjectURL(new Blob([fdata], { type: "application/json" }));
            var an = document.createElement("a"); an.href = url; an.download = fname; document.body.appendChild(an); an.click(); an.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
            flash("Sicherung gespeichert.");
          } catch (x) { flash("Die Sicherung ist nicht gelungen."); }
          break;
        }
        store.downloads.save({ filename: fname, data: fdata })
          .then(function () { flash("Sicherung gespeichert."); })
          .catch(function (err) { if (!err || err.code !== "declined") flash("Die Sicherung ist nicht gelungen."); });
        break;
      }
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === "f-handle") { var v = t.value.replace(/^[@\s]+/, ""); if (v !== t.value) t.value = v; }
    if (t.id === "f-phone") reformatPhone(t, e);
    if (t.classList && t.classList.contains("autosize")) {
      if (t.classList.contains("t-url") && /\n/.test(t.value)) t.value = t.value.replace(/\s*\n+\s*/g, "");
      autosize(t);
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "imp-file") {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var data;
        try { data = JSON.parse(String(rd.result)); } catch (x) { flash("Die Datei ist keine gültige Sicherung."); return; }
        var KINDS = { account: 1, income: 1, post: 1, settings: 1 }, n = 0;
        if (!data || typeof data !== "object" || Array.isArray(data)) { flash("Die Datei ist keine gültige Sicherung."); return; }
        Object.keys(data).forEach(function (id) {
          var d = data[id];
          if (d && typeof d === "object" && KINDS[d.kind] && /^[\w-]{1,80}$/.test(id)) { saveDoc(id, d); n++; }
        });
        flash(n ? n + " Einträge eingelesen." : "In der Datei wurden keine Einträge gefunden.");
      };
      rd.onerror = function () { flash("Die Datei konnte nicht gelesen werden."); };
      rd.readAsText(f);
      return;
    }
    if (e.target && e.target.id === "p-posted") {
      var st = document.getElementById("p-status");
      if (st) {
        if (e.target.checked) { if (st.value !== "Gepostet") S.prevStatus = st.value; st.value = "Gepostet"; }
        else if (st.value === "Gepostet") st.value = S.prevStatus && S.prevStatus !== "Gepostet" ? S.prevStatus : "Idee";
      }
      return;
    }
    if (e.target && e.target.id === "p-account") {
      var w = document.getElementById("p-url-wrap");
      if (w) w.hidden = !isYT(e.target.value);
      return;
    }
    if (e.target && e.target.id === "p-status") {
      var cb = document.getElementById("p-posted");
      if (cb) cb.checked = e.target.value === "Gepostet";
      return;
    }
    if (e.target && e.target.id === "i-sort") saveDoc("settings", Object.assign({}, S.docs.settings || {}, { kind: "settings", incomeSort: e.target.value }));
  });

  document.getElementById("home").addEventListener("click", function () { show(null); });

  render(true);
  initStore();
  loadRate();
})();
</script>

</body>
</html>
